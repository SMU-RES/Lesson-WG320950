[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "segmentation-demo"
version = "0.1.0"
description = "Local YOLO instance segmentation demo with CLI and Gradio UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ultralytics",
  "gradio",
  "pillow",
  "opencv-python",
  "numpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
segmentation-demo = "segmentation_demo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["segmentation_demo*"]
